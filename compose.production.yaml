# Production deployment override for compose.yaml.
#
# Apply it ON TOP of the base file:
#   docker compose -f compose.yaml -f compose.production.yaml --env-file .env up --build
#
# The base compose.yaml publishes NO host ports (production-safe), so this override
# only re-adds the single port the reverse proxy needs: the backend, bound to the
# backend server's LAN interface (192.168.1.35) rather than every host interface
# (0.0.0.0).
#
# Production network boundary (enforced here + by the host firewall):
#   * backend 18080 is bound to 192.168.1.35 (the backend server's LAN interface),
#     never on 0.0.0.0. Binding to a specific interface stops it being exposed on
#     the server's other local interfaces, but it does NOT by itself restrict
#     *clients*: any LAN host that can reach 192.168.1.35:18080 can still connect.
#     Therefore the host firewall MUST additionally allow TCP 18080 only from the
#     Nginx server (and trusted administration hosts). This is required because the
#     backend trusts X-Forwarded-* headers, so an untrusted client that could reach
#     it directly could forge those headers.
#   * MinIO (9000/9001) and RabbitMQ (5672/15672) are NOT published to the LAN; they
#     are reachable only on the compose internal network (the backend uses
#     http://minio:9000 and rabbitmq:5672 internally).
#   * stack-test authentication is never enabled in production: the override pins the
#     mode to google, clears the stack-test token, and sets SPRING_PROFILES_ACTIVE to
#     empty, regardless of the production .env.
#   * The OCR service (192.168.1.34:8080) must NOT be exposed through Nginx. That is
#     an internal backend-to-backend dependency, not a public route, and is enforced
#     by the Nginx configuration in the frontend repository.
services:
  backend:
    ports:
      - "192.168.1.35:18080:18080"
    environment:
      # Pin production to google mode with no stack-test credential and no active test
      # profile, so an accidental .env value cannot activate the stack-test
      # authentication. These overrides take precedence over the base file and over the
      # production .env.
      APP_SECURITY_MODE: google
      APP_SECURITY_STACK_TEST_TOKEN: ""
      SPRING_PROFILES_ACTIVE: ""
