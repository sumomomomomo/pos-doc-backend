services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      # Local-development console only; never expose publicly.
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-pos-documents}
    # The minio/mc image sets ENTRYPOINT to the "mc" binary, so a
    # ["/bin/sh", "-c", ...] command would be passed as arguments to mc.
    # Override the entrypoint with the shell so the script below actually
    # runs in /bin/sh.
    entrypoint: ["/bin/sh", "-c"]
    # Single-element list: Compose must pass the whole script as ONE argument
    # to `sh -c`. A plain string would be split on whitespace by Compose, and
    # `sh -c` would only execute the first token.
    command:
      ["i=0; while [ $$i -lt 60 ]; do if mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD --quiet; then mc mb --ignore-existing local/$$MINIO_BUCKET && exit 0; fi; echo 'minio-init: waiting for MinIO (attempt $$i/60)'; i=$$((i+1)); sleep 1; done; echo 'minio-init: MinIO not available after 60 attempts' >&2; exit 1"]

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      # Local-development management UI only; never expose publicly.
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      SQLITE_URL: jdbc:sqlite:/data/sqlite/pos-doc.db
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-pos-documents}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - sqlite-data:/data/sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v1/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  minio-data:
  sqlite-data:
  rabbitmq-data:
