services:
  minio:
    # MinIO stopped publishing its community images to Docker Hub/Quay (Oct 2025);
    # cgr.dev/chainguard/minio is a maintained, S3-compatible drop-in.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    # No host port publication in the base file: this keeps the default
    # (production-oriented) deployment from exposing MinIO on every host
    # interface. Local development publishes MinIO on 127.0.0.1 via
    # compose.dev.yaml; production publishes none (see compose.production.yaml).
    # MinIO is always reachable from the backend on the compose internal network
    # at http://minio:9000 regardless of host publication.
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    # Reuses the minio image above (it bundles the "mc" client + /bin/sh + sleep);
    # only "mc" is used here to create the bucket.
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-pos-documents}
    # The image's ENTRYPOINT is the "minio" server binary, so a
    # ["/bin/sh", "-c", ...] command would be passed as arguments to it.
    # Override the entrypoint with the shell so the script below actually
    # runs in /bin/sh (the image provides /bin/sh and the "mc" client).
    entrypoint: ["/bin/sh", "-c"]
    # Single-element list: Compose must pass the whole script as ONE argument
    # to `sh -c`. A plain string would be split on whitespace by Compose, and
    # `sh -c` would only execute the first token.
    command:
      ["i=0; while [ $$i -lt 60 ]; do if mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD --quiet; then mc mb --ignore-existing local/$$MINIO_BUCKET && exit 0; fi; echo 'minio-init: waiting for MinIO (attempt $$i/60)'; i=$$((i+1)); sleep 1; done; echo 'minio-init: MinIO not available after 60 attempts' >&2; exit 1"]

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    # No host port publication in the base file (production-safe). Local
    # development publishes the AMQP and management ports on 127.0.0.1 via
    # compose.dev.yaml; production publishes none (see compose.production.yaml).
    # The backend always reaches RabbitMQ on the compose internal network at
    # rabbitmq:5672 regardless of host publication.
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: .
    # No host port publication in the base file (production-safe): the default
    # deployment must not bind the backend on every host interface (0.0.0.0). The
    # backend trusts X-Forwarded-* headers, so untrusted clients must not be able
    # to reach it directly and forge them. Local development publishes 18080 on
    # 127.0.0.1 via compose.dev.yaml; production publishes it only on the Nginx
    # host interface via compose.production.yaml.
    depends_on:
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      SQLITE_URL: jdbc:sqlite:/data/sqlite/pos-doc.db
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-pos-documents}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Default: true. The verify-container-stack script disables the
      # consumer for its first phase and re-enables it for the second.
      INGESTION_CONSUMER_ENABLED: ${INGESTION_CONSUMER_ENABLED:-true}
      # --- OCR (llama.cpp serving Qwen 3.5 8B) ---
      # The server origin defaults to the LAN llama.cpp endpoint; isolated
      # verification overrides it to the OCR stub. The model ID is
      # deployment-specific and required (fail before start if missing): copy
      # the exact data[0].id from http://192.168.1.34:8080/models.
      OCR_SERVER_ORIGIN: ${OCR_SERVER_ORIGIN:-http://192.168.1.34:8080}
      OCR_MODEL: ${OCR_MODEL:?OCR_MODEL is required}
      # --- Security (Google OIDC) ---
      # Fail-closed: in the default "google" mode the client credentials are
      # required. See SecurityStartupValidator.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      APP_SECURITY_MODE: ${APP_SECURITY_MODE:-google}
      # Each subject list is optional (may be an empty string) so a reviewer-only
      # deployment can leave the viewer list empty. SecurityProperties enforces
      # that the two lists are not BOTH empty (at least one allowed subject).
      APP_SECURITY_GOOGLE_VIEWER_SUBJECTS: ${APP_SECURITY_GOOGLE_VIEWER_SUBJECTS:-}
      APP_SECURITY_GOOGLE_REVIEWER_SUBJECTS: ${APP_SECURITY_GOOGLE_REVIEWER_SUBJECTS:-}
      APP_SECURITY_ALLOWED_ORIGINS: ${APP_SECURITY_ALLOWED_ORIGINS:-}
      APP_SECURITY_POST_LOGIN_REDIRECT: ${APP_SECURITY_POST_LOGIN_REDIRECT:-/pos/}
      APP_SECURITY_STACK_TEST_TOKEN: ${APP_SECURITY_STACK_TEST_TOKEN:-}
      # Spring profile. Must be "stack-test" (and APP_SECURITY_MODE=stack-test)
      # for the isolated stack-test authentication mode to activate.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    volumes:
      - sqlite-data:/data/sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:18080/api/v1/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  minio-data:
  sqlite-data:
  rabbitmq-data:
