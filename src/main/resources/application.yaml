spring:
  application:
    name: pos-doc-backend

  datasource:
    url: ${SQLITE_URL:jdbc:sqlite:./pos-doc.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 5000
      data-source-properties:
        foreign_keys: "true"
        journal_mode: WAL
        busy_timeout: "5000"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

server:
  servlet:
    context-path: /api/v1

# The generated API interfaces carry the base path as a placeholder; it is
# supplied via the servlet context path above, so it must be overridden to an
# empty value to keep the deployed routes at /api/v1/...
openapi:
  pOSDocumentIngestion:
    base-path: ""

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:local-dev-access}
    secret-key: ${MINIO_SECRET_KEY:local-dev-secret-change-me}
    bucket: ${MINIO_BUCKET:pos-documents}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
