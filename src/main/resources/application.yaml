spring:
  application:
    name: pos-doc-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${SQLITE_URL:jdbc:sqlite:./pos-doc.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 5000
      data-source-properties:
        foreign_keys: "true"
        journal_mode: WAL
        busy_timeout: "5000"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:local-dev-rabbit}
    password: ${RABBITMQ_PASSWORD:local-dev-rabbit-secret-change-me}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  servlet:
    context-path: /api/v1

# The generated API interfaces carry the base path as a placeholder; it is
# supplied via the servlet context path above, so it must be overridden to an
# empty value to keep the deployed routes at /api/v1/...
openapi:
  pOSDocumentIngestion:
    base-path: ""

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:local-dev-access}
    secret-key: ${MINIO_SECRET_KEY:local-dev-secret-change-me}
    bucket: ${MINIO_BUCKET:pos-documents}

app:
  rendering:
    first-page:
      dpi: 200
      max-pdf-bytes: 52428800
      max-width-pixels: 5000
      max-height-pixels: 5000
      max-pixels: 16000000
      max-png-bytes: 33554432
      max-concurrent-renders: 1
  upload:
    max-compressed-bytes: 10485760
    max-uncompressed-bytes: 262144000
    max-entry-bytes: 52428800
    max-file-entries: 100
    max-compression-ratio: 100
  ingestion:
    consumer:
      enabled: ${INGESTION_CONSUMER_ENABLED:true}
      concurrency: 1
      prefetch: 1
      max-attempts: 3
      initial-backoff-ms: 1000
      backoff-multiplier: 2.0
      max-backoff-ms: 5000
      max-message-bytes: 4096
  messaging:
    outbox:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      fixed-delay-ms: 1000
      batch-size: 20
      confirm-timeout-ms: 5000
    topology:
      exchange: pos.ingestion
      routing-key: ingestion.requested
      queue: pos.ingestion.jobs
      dead-letter-exchange: pos.ingestion.dlx
      dead-letter-routing-key: ingestion.dead
      dead-letter-queue: pos.ingestion.dead

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
